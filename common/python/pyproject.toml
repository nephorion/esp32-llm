[project]
name = "esp32tools"
version = "0.1.0"
description = "Shared host-side helpers for talking to the ESP32 projects over serial"
requires-python = ">=3.11"
dependencies = ["pyserial>=3.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["esp32tools"]
